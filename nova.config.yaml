vault_name: "Nova — Knowledge Galaxy"
cumulo_default: equipo
language: es

# Mapeo type → carpeta en stars/
# El MCP y los slash commands usan este mapeo — no mover archivos manualmente.
type_folder_map:
  concept:             stars/conceptos
  adr:                 stars/decisiones
  query:               stars/consultas
  code:                stars/codigo
  endpoint:            stars/endpoints
  meeting:             stars/reuniones
  project:             stars/proyectos
  person:              stars/personas
  system:              stars/sistemas
  dataset:             stars/datos
  database:            stars/datos
  table:               stars/datos
  pipeline:            stars/datos
  dashboard_spec:      stars/specs
  brd:                 stars/specs
  runbook:             stars/runbooks
  document:            stars/documentos
  changelog:           stars/registros
  claude_conversation: stars/registros

# Fases del lifecycle de una estrella
phases:
  - nebula       # inbox/ — contenido crudo sin procesar
  - formacion    # stars/ — procesado por Claude en su carpeta destino, pendiente de aprobación humana (/aprobar)
  - activa       # stars/ — conocimiento vigente y verificado
  - muriendo     # stars/ — deprecado, tratar con cautela
  - muerta       # archive/ — archivado, peso mínimo en búsqueda
  - remanente    # archive/ — fusionada en otra estrella, solo redirect

# Cúmulos activos — editar según los equipos/áreas de tu organización
# Ejemplo: bi, infraestructura, rpa, negocio, corporativo
cumulos:
  - equipo

# Constelaciones semilla — reemplazar con las de tu organización
# Ver constellations/ para los archivos MOC correspondientes
seed_constellations: []

# Umbrales de health check (usados por /dark-matter)
health_thresholds:
  ORPHAN_ALERT_DAYS: 7
  STALE_DRAFT_DAYS: 30
  FUSION_THRESHOLD: 0.9
  CONSTELLATION_MAX_STARS: 35
  CONSTELLATION_MIN_CLUSTER: 5

# Tipos que se enriquecen con LLM durante /nebula-process
llm_enrichment_types:
  - query
  - code
  - endpoint

# Tipos que se indexan completos (sin chunking)
full_index_types:
  - query
  - code
  - endpoint
  - adr

# Tipos que se indexan por chunks
chunked_index_types:
  - concept
  - dataset
  - database
  - table
  - pipeline
  - brd
  - dashboard_spec
  - meeting
  - project
  - runbook
  - changelog
  - claude_conversation
  - system
  - person
  - document

# Sincronización de reuniones de Read.ai (usada por /read-ai-sync y la tarea programada)
read_ai_sync:
  owner: Nombre_Apellido       # author/owner de las estrellas creadas
  ventana_inicial_dias: 14     # alcance de la primera corrida, sin estado previo
  solape_horas: 48             # re-revisa este margen antes de la última corrida (Read.ai tarda en procesar)
  duracion_minima_min: 5       # reuniones más cortas se omiten
  asistentes_minimos: 2        # con menos asistentes reales se omite (sesiones donde nadie llegó)
  excluir_titulos: []          # patrones de título a ignorar, p. ej. ["personal", "1:1 médico"]
